<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="c">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>

  <!-- White base -->
  <circle cx="50" cy="50" r="50" fill="#ffffff"/>

  <!-- Colored bands clipped to circle -->
  <g clip-path="url(#c)">
    <!-- Green band -->
    <path d="M 18 18 Q 50 40 82 82" fill="none" stroke="#2a9d4e" stroke-width="18" stroke-linecap="round"/>
    <!-- Green highlight -->
    <path d="M 20 16 Q 52 38 84 80" fill="none" stroke="#3dbb62" stroke-width="6" stroke-linecap="round"/>

    <!-- Yellow/Gold band -->
    <path d="M 36 14 Q 62 32 72 50 Q 80 65 70 82" fill="none" stroke="#f0b400" stroke-width="15" stroke-linecap="round"/>
    <!-- Yellow highlight -->
    <path d="M 38 12 Q 64 30 74 48 Q 82 63 73 80" fill="none" stroke="#f5c518" stroke-width="5" stroke-linecap="round"/>

    <!-- Red band -->
    <path d="M 14 46 Q 34 56 50 70 Q 58 80 56 92" fill="none" stroke="#cc2200" stroke-width="13" stroke-linecap="round"/>
    <!-- Red highlight -->
    <path d="M 15 44 Q 35 54 51 68 Q 59 78 58 90" fill="none" stroke="#e63300" stroke-width="4" stroke-linecap="round"/>

    <!-- Blue band -->
    <path d="M 68 16 Q 72 40 60 58 Q 48 74 28 84" fill="none" stroke="#1565c0" stroke-width="14" stroke-linecap="round"/>
    <!-- Blue highlight -->
    <path d="M 70 18 Q 74 42 62 60 Q 50 76 30 86" fill="none" stroke="#1e88e5" stroke-width="4" stroke-linecap="round"/>

    <!-- Dark green thin accent -->
    <path d="M 12 32 Q 26 44 36 58 Q 44 70 42 84" fill="none" stroke="#1a6e35" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Sphere border -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#cccccc" stroke-width="1"/>
</svg>
