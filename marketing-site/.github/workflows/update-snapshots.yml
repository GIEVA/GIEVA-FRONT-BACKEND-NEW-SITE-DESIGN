name: Update visual baselines

# Manually-triggered: regenerates the committed Playwright screenshots (tests/__screenshots__)
# inside the exact pinned Playwright container CI's e2e job uses, then commits the result
# straight to the branch that was run against. Visual baselines are Chromium-build-specific
# (README "Visual regression") — this is the canonical environment to generate them in, unlike
# an arbitrary local/sandbox machine which may substitute different system fonts and render a
# few pixels off. Run this from the Actions tab whenever baselines need a real refresh (e.g.
# after a visual-regression job fails on a font/rendering mismatch, not a real content change).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-snapshots:
    name: Regenerate + commit visual baselines
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      # The lockfile is environment-specific in the same way the baselines are.
      # `@img/sharp-wasm32` (an optional, platform-gated dep of Astro's image service)
      # declares `@emnapi/runtime`, and npm decides whether to record a hoisted entry for it
      # based on the host it resolves on: npm 11.6.2 / Node 25 / linux-x64 prunes that branch,
      # this container demands it, and `npm ci` dies with EUSAGE in between — before any gate
      # runs. That desync went unnoticed from bf95f03 (2026-07-24) to 2026-07-28: six
      # consecutive CI runs failed at the install step, so the a11y, visual, and Lighthouse
      # gates were not actually running. Regenerating the lockfile on a dev machine can't fix
      # it; it has to come from the environment that installs it. So repair it here, and
      # commit the result alongside the baselines.
      - name: Install (repairing the lockfile in-container if npm ci rejects it)
        run: |
          npm ci || {
            echo "::warning::npm ci rejected the lockfile; regenerating it in this container"
            npm install --package-lock-only --no-audit --no-fund
            npm ci
          }
      - name: Build (so /styleguide etc. are current before screenshotting)
        run: npm run build
        env:
          INCLUDE_STYLEGUIDE: '1'
      - name: Regenerate baselines
        run: npm run test:update-snapshots
        env:
          INCLUDE_STYLEGUIDE: '1'
      # `if: always()` because `--update-snapshots` WRITES the PNGs as it goes, but the run exits
      # non-zero if any non-snapshot test in the suite fails — and without this, that unrelated
      # failure discarded every baseline the step had just generated. That is not hypothetical:
      # it happened on 2026-08-11, when a pre-existing `header-fit` failure meant PR #14's
      # shell-wide baseline refresh was thrown away, leaving `main` with visual changes and stale
      # baselines. The step below still reports the failure, so the job goes red either way; it
      # just no longer throws away the work first.
      - name: Commit + push if anything changed
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__ package-lock.json
          if git diff --cached --quiet; then
            echo "No baseline or lockfile changes."
            exit 0
          fi
          git commit -m "test: regenerate visual baselines in the canonical Playwright container"
          git push
